name: easylauncher
description: "A text-first Android launcher for monochrome e-ink phones that also provides a fullscreen TV home for Linux."
publish_to: 'none'
version: 0.2.3+8

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
